# Deployment override: adds an nginx reverse proxy so Nidhi is reachable
# on a single port (8080) -> UI (frontend:3000) + API (backend:8000).
# Auto-merged with docker-compose.yml by `docker compose up`.

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nidhi.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
